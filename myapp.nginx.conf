# Nginx 站点配置 - 可作为 /etc/nginx/sites-available/myapp 使用
# 注意：域名/IP 和 SSL 证书路径请根据实际修改

upstream backend {
    server 127.0.0.1:3000;          # 本机Node.js
    # server 192.168.113.134:3000;  # 其他应用节点（多机时启用）
}

server {
    listen 80;
    server_name 192.168.113.132;    # 修改为你的域名或IP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 192.168.113.132;    # 修改为你的域名或IP

    ssl_certificate /etc/nginx/ssl/myapp.crt;
    ssl_certificate_key /etc/nginx/ssl/myapp.key;

    location / {
        root /home/deploy/myapp;
        index index.html;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
