<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3>📝 博客后台管理</h3>
                    </div>
                    <div class="card-body">
                        <!-- 统计 -->
                        <div id="stats" class="alert alert-info">
                            总访问量：<span id="visitCount">加载中...</span>
                        </div>

                        <!-- 发布文章 -->
                        <h5>✍️ 发布新文章</h5>
                        <div class="mb-3">
                            <input type="text" id="titleInput" class="form-control" placeholder="文章标题">
                        </div>
                        <div class="mb-3">
                            <textarea id="contentInput" class="form-control" rows="3" placeholder="文章内容"></textarea>
                        </div>
                        <button id="publishBtn" class="btn btn-success mb-3">发布文章</button>

                        <hr>
                        <h5>📚 文章列表</h5>
                        <div id="postsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 加载文章列表
        function loadPosts() {
            fetch('/api/posts')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('postsList');
                    if (data.length === 0) {
                        list.innerHTML = '<div class="alert alert-warning">暂无文章，发布第一篇吧！</div>';
                        return;
                    }
                    list.innerHTML = data.map(post => `
                        <div class="card mb-2">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <h6>${post.title}</h6>
                                    <small class="text-muted">${post.created_at}</small>
                                    <p class="mb-0">${post.content.substring(0, 50)}...</p>
                                </div>
                                <button class="btn btn-danger btn-sm delete-btn" data-id="${post.id}">删除</button>
                            </div>
                        </div>
                    `).join('');

                    // 绑定删除事件
                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const id = this.dataset.id;
                            if (confirm('确认删除这篇文章？')) {
                                fetch(`/api/posts/${id}`, { method: 'DELETE' })
                                    .then(res => res.json())
                                    .then(() => {
                                        loadPosts();
                                        loadCount();
                                    });
                            }
                        });
                    });
                });
        }

        // 加载访问量
        function loadCount() {
            fetch('/api/count')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('visitCount').textContent = data.visits;
                });
        }

        // 发布文章
        document.getElementById('publishBtn').addEventListener('click', function() {
            const title = document.getElementById('titleInput').value.trim();
            const content = document.getElementById('contentInput').value.trim();
            if (!title || !content) {
                alert('标题和内容不能为空！');
                return;
            }
            fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('🎉 发布成功！');
                    document.getElementById('titleInput').value = '';
                    document.getElementById('contentInput').value = '';
                    loadPosts();
                    loadCount();
                } else {
                    alert('发布失败：' + data.error);
                }
            });
        });

        // 初始化
        loadPosts();
        loadCount();
    </script>
</body>
</html>
